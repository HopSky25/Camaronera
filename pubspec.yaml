name: verificador_campo
description: "CamaronMarket - la app para todos los perfiles: camaronera, empacadora, verificadora, técnico de campo (sin internet) y maquilador."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado de la app (bandeja, cola de sincronización)
  provider: ^6.1.2
  # Base de datos local en el teléfono
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  # Red
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  # Clave de API guardada cifrada
  flutter_secure_storage: ^9.2.2
  # Campo: GPS y cámara
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  # Identificadores para la idempotencia
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.3
  device_info_plus: ^12.4.0
  crypto: ^3.0.7
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2
  image: ^4.12.0
  app_links: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pointycastle: ^4.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

# Ícono: el símbolo de CamaronMarket (el camarón en el círculo, sin texto).
# Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  image_path: "assets/icono/icono.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icono/primer_plano.png"
  adaptive_icon_foreground_inset: 4
  adaptive_icon_monochrome: "assets/icono/monocromo.png"
  min_sdk_android: 24

# Pantalla de carga: logo completo centrado sobre blanco (también Android 12+).
# Regenerar con: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icono/logo_carga.png
  android_12:
    color: "#FFFFFF"
    image: assets/icono/logo_carga_android12.png
    icon_background_color: "#FFFFFF"
  web: false
