name: verificador_campo
description: "CamaronMarket - app de campo del técnico verificador (trabaja sin internet y sincroniza después)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado de la app (bandeja, cola de sincronización)
  provider: ^6.1.2
  # Base de datos local en el teléfono
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  # Red
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  # Clave de API guardada cifrada
  flutter_secure_storage: ^9.2.2
  # Campo: GPS y cámara
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  # Identificadores para la idempotencia
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
