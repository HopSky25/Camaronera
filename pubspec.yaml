name: verificador_campo
description: "CamaronMarket - la app para todos los perfiles: camaronera, empacadora, verificadora, técnico de campo (sin internet) y maquilador."
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Estado de la app (bandeja, cola de sincronización)
  provider: ^6.1.2
  # Base de datos local en el teléfono
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.4
  # Red
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  # Clave de API guardada cifrada
  flutter_secure_storage: ^9.2.2
  # Campo: GPS y cámara
  geolocator: ^13.0.1
  image_picker: ^1.1.2
  # Identificadores para la idempotencia
  uuid: ^4.5.1
  intl: ^0.19.0
  url_launcher: ^6.3.3
  device_info_plus: ^12.4.0
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pointycastle: ^4.0.0
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
