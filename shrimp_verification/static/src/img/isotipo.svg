<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 10 120 124" width="240" height="248">
  <defs>
    <linearGradient id="cuerpo" x1="0.9" y1="0.05" x2="0.15" y2="0.95">
      <stop offset="0%"   stop-color="#123E5C"/>
      <stop offset="55%"  stop-color="#17788F"/>
      <stop offset="100%" stop-color="#14A0B0"/>
    </linearGradient>
  </defs>

  <!-- El cuerpo es una traza segmentada: cada segmento, un eslabón de la cadena
       (semillero · laboratorio · camaronera · verificación · entrega). -->
  <path d="M94 34 C66 22, 34 32, 28 58 C22 82, 36 100, 58 104"
        fill="none" stroke="url(#cuerpo)" stroke-width="21"
        stroke-linecap="butt" stroke-dasharray="19 5.5"/>

  <!-- Cola en abanico, abriéndose hacia fuera -->
  <path d="M58 104 L88 100 M58 104 L90 112 M58 104 L80 122"
        fill="none" stroke="#14A0B0" stroke-width="8" stroke-linecap="round"/>

  <!-- Rostro -->
  <path d="M95 30 C105 23, 114 26, 117 34"
        fill="none" stroke="#123E5C" stroke-width="5" stroke-linecap="round"/>

  <!-- Ojo -->
  <circle cx="92" cy="35" r="4.6" fill="#FFFFFF"/>
</svg>
